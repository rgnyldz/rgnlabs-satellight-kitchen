substitutions:
  voice_assist_idle_phase_id: '1'
  voice_assist_waiting_for_command_phase_id: '2'
  voice_assist_listening_for_command_phase_id: '3'
  voice_assist_thinking_phase_id: '4'
  voice_assist_replying_phase_id: '5'
  voice_assist_not_ready_phase_id: '10'
  voice_assist_error_phase_id: '11'
  voice_assist_muted_phase_id: '12'
  hidden_ssid: "false"
  name: kitchen-satellight-v2
  friendly_name: "Kitchen - SatelLight (V2)"
  tts_media_player: media_player.rs_2_entrance_media_player

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  cpu_frequency: 240MHz
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

# Enable Home Assistant API
api:
  id: api_id
  encryption:
    key: "XXXXXXXXXXnotthistime:)XXXXXXXXXXXXX"
  actions:
    - action: start_va
      then:
        - voice_assistant.start
    - action: stop_va
      then:
        - voice_assistant.stop
  on_client_connected:
    - script.execute: control_leds
  on_client_disconnected:
    - script.execute: control_leds

ota:
  - platform: esphome
    id: ota_esphome
    password: "XXXXXXXXXXnotthistime:)XXXXXXXXXXXXX"

psram:
  mode: octal
  speed: 80MHz

globals:
  - id: init_in_progress
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: improv_ble_in_progress
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: voice_assistant_phase
    type: int
    restore_value: no
    initial_value: ${voice_assist_not_ready_phase_id}
  - id: saved_time_zone
    type: std::string
    restore_value: yes
    initial_value: '"UTC0"'
  - id: factory_reset_requested
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: continue_session
    type: bool
    restore_value: no
    initial_value: 'false'

wifi:
  id: wifi_id
  fast_connect: ${hidden_ssid}
  output_power: 8.5
  networks:
  - ssid: !secret wifi_ssid
    password: !secret wifi_password
  on_connect:
    - lambda: id(improv_ble_in_progress) = false;
    - script.execute: control_leds
  on_disconnect:
    - script.execute: control_leds
  manual_ip:
    static_ip: 192.168.2.81
    gateway: 192.168.2.1
    subnet: 255.255.255.0
  ap:
    ssid: "Kitchen--Satellight"
    password: "XXXXXX"

captive_portal:

improv_serial:

uart:
  id: uart_id
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 115200
  parity: NONE
  stop_bits: 1

ld2420:

i2s_audio:
  - id: i2s_input
    i2s_bclk_pin: GPIO16 #SCK
    i2s_lrclk_pin: GPIO15  #WS

microphone:
  - platform: i2s_audio
    id: i2s_mics
    i2s_din_pin: GPIO7
    adc_type: external
    pdm: false
    sample_rate: 16000
    bits_per_sample: 32bit
    i2s_mode: primary
    i2s_audio_id: i2s_input
    channel: left



light:
  - platform: esp32_rmt_led_strip
    id: led_internal
    name: "Onboard LED"
    rgb_order: GRB
    pin: GPIO48
    num_leds: 1
    rmt_symbols: 96
    chipset: ws2812
    effects:
      - pulse:
          name: "Slow Pulse"
          transition_length: 250ms
          update_interval: 250ms
          min_brightness: 50%
          max_brightness: 100%
      - pulse:
          name: "Fast Pulse"
          transition_length: 100ms
          update_interval: 100ms
          min_brightness: 50%
          max_brightness: 100%
      - addressable_scan:
          name: "Scan"
          move_interval: 50ms
          scan_width: 2
  - platform: esp32_rmt_led_strip
    rgb_order: GRB
    chipset: SK6812
    rmt_symbols: 96
    is_rgbw: true
    pin: GPIO02
    num_leds: 57
    name: "Kitchen - Main light"
    effects:
      - addressable_lambda:
          name: "WLED Rainbow"
          update_interval: 20ms
          lambda: |-
            static int start = 0;

            auto hsv_to_rgb = [](float h, float s, float v) -> esphome::Color {
                float r, g, b;
                int i = int(h * 6);
                float f = h * 6 - i;
                float p = v * (1 - s);
                float q = v * (1 - f * s);
                float t = v * (1 - (1 - f) * s);

                switch (i % 6) {
                    case 0: r = v, g = t, b = p; break;
                    case 1: r = q, g = v, b = p; break;
                    case 2: r = p, g = v, b = t; break;
                    case 3: r = p, g = q, b = v; break;
                    case 4: r = t, g = p, b = v; break;
                    case 5: r = v, g = p, b = q; break;
                }

                return esphome::Color(r * 255, g * 255, b * 255);
            };

            for (int i = 0; i < it.size(); i++) {
              float hue = fmod((start + i * 360.0 / it.size()), 360) / 360.0;
              it[i] = hsv_to_rgb(hue, 1.0, 1.0);
            }

            start += 3;
            if (start >= 360) start = 0;
      - addressable_lambda:
          name: "WLED Fireworks"
          update_interval: 50ms
          lambda: |-
            static std::vector<int> sparks;
            static int cooldown = 0;
            static int num_sparks = 5; // Adjust for more or fewer sparks

            // Initialize the spark list
            if (sparks.empty()) {
              sparks.resize(num_sparks, -1);
            }

            // Fade out the LEDs
            for (int i = 0; i < it.size(); i++) {
              it[i] = it[i].get().fade_to_black(20);
            }

            // Randomly add new sparks
            if (cooldown <= 0) {
              for (int i = 0; i < num_sparks; i++) {
                if (sparks[i] == -1 && random_uint32() % 10 == 0) {
                  sparks[i] = random_uint32() % it.size();
                }
              }
              cooldown = 5;
            } else {
              cooldown--;
            }

            // Render sparks
            for (int i = 0; i < num_sparks; i++) {
              if (sparks[i] != -1) {
                it[sparks[i]] = esphome::Color(255, 150, 50); // Warm orange spark
                if (random_uint32() % 4 == 0) {
                  sparks[i] = -1; // Spark dies
                }
              }
            }
      - addressable_lambda:
          name: "Cycle Colors"
          update_interval: 10ms
          lambda: |-

            // it.size() - Number of LEDs
            // it[num] - Access the LED at index num.

            // Set the LED at num to the given r, g, b values
            // it[num] = Color(r, g, b);

            // Get the color at index num (Color instance)
            // it[num].get();

            static uint16_t num1 = 0;
            static uint16_t red = 255;
            static uint16_t green = 3;
            static uint16_t blue = 3;

            uint16_t num = num1;
            uint16_t numled = 71;

            if(red > 251 && blue < 4 && green < 252){
              green+=5;

            } else if (red > 3 && green > 251 && blue < 4){
              red-=5;

            } else if (red < 4 && green > 251 && blue < 252){
              blue+=5;
              
            } else if (red < 4 && green > 3 && blue > 251){
              green-=5;
              
            } else if (red < 252 && green < 4 && blue > 251){
              red+=5;
              
            } else if (red > 251 && green < 4 && blue > 3){
              blue-=5;
              
            }

            it[num] = Color(red, green, blue);
            it[(numled) - num] = Color(red, green, blue);
            if(num1 == (numled +1) / 2){
              num1 = 0;
            } else {
              num1++;
            }
      - addressable_lambda:
          name: "ColorScan"
          update_interval: 50ms
          lambda: |-

            // it.size() - Number of LEDs
            // it[num] - Access the LED at index num.

            // Set the LED at num to the given r, g, b values
            // it[num] = Color(r, g, b);

            // Get the color at index num (Color instance)
            // it[num].get();

            static uint16_t num1 = 0;
            static uint16_t red = 255;
            static uint16_t green = 3;
            static uint16_t blue = 3;
            static bool dir = false;
            
            uint16_t num = num1;
            uint16_t numled = 71;

            if(red > 251 && blue < 4 && green < 252){
              green+=5;

            } else if (red > 3 && green > 251 && blue < 4){
              red-=5;

            } else if (red < 4 && green > 251 && blue < 252){
              blue+=5;
              
            } else if (red < 4 && green > 3 && blue > 251){
              green-=5;
              
            } else if (red < 252 && green < 4 && blue > 251){
              red+=5;
              
            } else if (red > 251 && green < 4 && blue > 3){
              blue-=5;
              
            }

            it[num] = Color(red, green, blue);
            if(dir) {
              if(num1 == numled){
                dir = false;
              } else{
                num1++;
              }
            } else  {
              if(num1 == 0){
                dir = true;
              } else{
                num1--;
              }
            }

script:
  # - id: sync_ceiling_to_main
  #   mode: restart
  #   then:
  #     - lambda: |-
  #         auto main_state = id(led_main).remote_values;
  #         auto call = id(led_internal).make_call();
          
  #         // Sync Colors & Brightness
  #         call.set_rgbw(
  #           main_state.get_red(), 
  #           main_state.get_green(), 
  #           main_state.get_blue(), 
  #           main_state.get_white()
  #         );
  #         call.set_brightness(main_state.get_brightness());
          
  #         // Sync Effect - Fixed the ambiguous call error by casting to std::string
  #         call.set_effect((std::string)id(led_main).get_effect_name());
          
  #         call.perform();
  - id: continue_conversation_restart
    mode: restart
    then:
      - wait_until:
          condition:
            lambda: |-
              auto state = id(entrance_player_state).state;
              return state == "idle" || state == "paused" || state == "off";
          timeout: 30s
      - delay: 500ms
      - if:
          condition:
            lambda: 'return id(continue_session);'
          then:
            - voice_assistant.start:
          else:
            - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
            - script.execute: control_leds
  - id: control_leds
    then:
      - lambda: |
          if (id(improv_ble_in_progress)) {
            id(control_leds_improv_ble_state).execute();
          } else if (id(init_in_progress)) {
            id(control_leds_init_state).execute();
          } else if (!id(wifi_id).is_connected() || !id(api_id).is_connected()){
            id(control_leds_no_ha_connection_state).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_waiting_for_command_phase_id}) {
            id(control_leds_voice_assistant_waiting_for_command_phase).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_listening_for_command_phase_id}) {
            id(control_leds_voice_assistant_listening_for_command_phase).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_thinking_phase_id}) {
            id(control_leds_voice_assistant_thinking_phase).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_replying_phase_id}) {
            id(control_leds_voice_assistant_replying_phase).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_error_phase_id}) {
            id(control_leds_voice_assistant_error_phase).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_not_ready_phase_id}) {
            id(control_leds_voice_assistant_not_ready_phase).execute();
          } else if (id(voice_assistant_phase) == ${voice_assist_idle_phase_id}) {
            id(control_leds_voice_assistant_idle_phase).execute();
          }

  - id: control_leds_improv_ble_state
    then:
      - light.turn_on:
          brightness: !lambda return max( id(led_internal).current_values.get_brightness() , 0.2f );
          red: 100%
          green: 89%
          blue: 71%
          id: led_internal
          color_mode: rgb_white
          white: 0%
          effect: "Slow Pulse"

  - id: control_leds_init_state
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - light.turn_on:
                brightness: !lambda return max( id(led_internal).current_values.get_brightness() , 0.2f );
                red: 9%
                green: 73%
                blue: 95%
                id: led_internal
                color_mode: rgb_white
                white: 0%
                effect: "Fast Pulse"
          else:
            - light.turn_on:
                brightness: !lambda return max( id(led_internal).current_values.get_brightness() , 0.2f );
                red: 9%
                green: 73%
                blue: 95%
                id: led_internal
                color_mode: rgb_white
                white: 0%
                effect: "Slow Pulse"
  - id: control_leds_no_ha_connection_state
    then:
      - light.turn_on:
          brightness: !lambda return max( id(led_internal).current_values.get_brightness() , 0.2f );
          red: 1
          green: 0
          blue: 0
          id: led_internal
          color_mode: rgb_white
          white: 0%
          effect: "Slow Pulse"
  - id: control_leds_voice_assistant_idle_phase
    then:
      - light.turn_off:
          id: led_internal

  - id: control_leds_voice_assistant_waiting_for_command_phase
    then:
      - light.turn_on:
          brightness: !lambda return max( id(led_internal).current_values.get_brightness() , 0.2f );
          red: 1
          green: 0.2
          blue: 1
          id: led_internal
          effect: "Slow Pulse"
          color_mode: rgb_white
          white: 0%

  - id: control_leds_voice_assistant_listening_for_command_phase
    then:
      - light.turn_on:
          brightness: !lambda return max( id(led_internal).current_values.get_brightness() , 0.2f );
          red: 1
          green: 0.2
          blue: 1
          id: led_internal
          effect: "Slow Pulse"
          color_mode: rgb_white
          white: 0%

  - id: control_leds_voice_assistant_thinking_phase
    then:
      - light.turn_on:
          brightness: !lambda return max( id(led_internal).current_values.get_brightness() , 0.2f );
          red: 1
          green: 0.2
          blue: 1
          id: led_internal
          color_mode: rgb_white
          white: 0%
          effect: "Fast Pulse"

  - id: control_leds_voice_assistant_replying_phase
    then:
      - light.turn_on:
          id: led_internal
          brightness: 0.4
          red: 20%
          green: 100%
          blue: 100%
          white: 0%
          color_mode: rgb_white
          effect: "Slow Pulse"

  - id: control_leds_voice_assistant_error_phase
    then:
      - light.turn_on:
          brightness: !lambda return max( id(led_internal).current_values.get_brightness() , 0.2f );
          red: 1
          green: 0
          blue: 0
          id: led_internal
          color_mode: rgb_white
          white: 0%
          effect: "Fast Pulse"

  - id: control_leds_voice_assistant_not_ready_phase
    then:
      - light.turn_on:
          brightness: !lambda return max( id(led_internal).current_values.get_brightness() , 0.2f );
          red: 1
          green: 0
          blue: 0
          id: led_internal
          color_mode: rgb_white
          white: 0%
          effect: "Slow Pulse"

  - id: activate_stop_word_once
    then:
      - delay: 1s
      - micro_wake_word.enable_model: stop
      - delay: 10s
      - micro_wake_word.disable_model: stop
  - id: send_tts_uri_event
    parameters:
      tts_uri: string
    then:
      - homeassistant.event:
          event: esphome.tts_uri
          data:
            uri: !lambda return tts_uri;
  - id: send_stt_text_event
    parameters:
      stt_text: string
    then:
      - homeassistant.event:
          event: esphome.stt_text
          data:
            text: !lambda return stt_text;

