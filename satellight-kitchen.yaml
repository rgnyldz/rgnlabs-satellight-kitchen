    id: entrance_player_state
    entity_id: ${tts_media_player}
    internal: true
  - platform: ld2420
    fw_version:
      name: LD2420 Firmware

select:
  - platform: ld2420
    operating_mode:
      name: Operating Mode
  - platform: logger
    id: logger_select
    name: Logger Level
    disabled_by_default: true

switch:
  - platform: template
    name: Enable Voice Assistant
    id: voice_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    icon: mdi:assistant
    on_turn_on:
      - light.turn_off:
          id: led_internal      

      - if:
          condition:
            lambda: return !id(init_in_progress);
          then:      
            - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
            - if:
                condition:
                  not:
                    - voice_assistant.is_running
                then:
                  - micro_wake_word.start
    on_turn_off:
      - light.turn_on:
          id: led_internal
          red: 90%
          green: 90%
          blue: 20%
          brightness: 90%
          effect: Scan
          color_mode: rgb_white
          white: 0%
      - if:
          condition:
            lambda: return !id(init_in_progress);
          then:      
            - voice_assistant.stop
            - micro_wake_word.stop
            - lambda: id(voice_assistant_phase) = ${voice_assist_muted_phase_id};
  - platform: template
    id: wake_sound
    name: Wake sound
    icon: "mdi:bullhorn"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
